---
openapi: 3.0.3
info:
  title: FigLab API
  version: 0.1.0
  license:
    name: AGPL-3.0-only
components:
  schemas: {}
paths:
  "/health":
    get:
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
  "/v1/me":
    get:
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: false
                type: object
                required:
                - email
                - role
                properties:
                  email:
                    minLength: 1
                    type: string
                  role:
                    anyOf:
                    - type: string
                      enum:
                      - admin
                    - type: string
                      enum:
                      - member
                  userId:
                    minLength: 1
                    type: string
                  personalWorkspaceId:
                    minLength: 1
                    type: string
  "/v1/projects":
    get:
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: false
                type: object
                required:
                - projects
                properties:
                  projects:
                    type: array
                    items:
                      additionalProperties: false
                      type: object
                      required:
                      - id
                      - workspaceId
                      - name
                      - status
                      - createdAt
                      - updatedAt
                      properties:
                        id:
                          minLength: 1
                          type: string
                        workspaceId:
                          minLength: 1
                          type: string
                        name:
                          minLength: 1
                          maxLength: 120
                          type: string
                        status:
                          anyOf:
                          - type: string
                            enum:
                            - active
                          - type: string
                            enum:
                            - deleting
                        folderId:
                          minLength: 1
                          type: string
                        createdBy:
                          minLength: 1
                          type: string
                        createdAt:
                          minLength: 1
                          type: string
                        updatedAt:
                          minLength: 1
                          type: string
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              type: object
              required:
              - name
              properties:
                name:
                  minLength: 1
                  maxLength: 120
                  type: string
                folderId:
                  format: uuid
                  type: string
                templateId:
                  format: uuid
                  type: string
      responses:
        '201':
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: false
                type: object
                required:
                - id
                - workspaceId
                - name
                - status
                - createdAt
                - updatedAt
                properties:
                  id:
                    minLength: 1
                    type: string
                  workspaceId:
                    minLength: 1
                    type: string
                  name:
                    minLength: 1
                    maxLength: 120
                    type: string
                  status:
                    anyOf:
                    - type: string
                      enum:
                      - active
                    - type: string
                      enum:
                      - deleting
                  folderId:
                    minLength: 1
                    type: string
                  createdBy:
                    minLength: 1
                    type: string
                  createdAt:
                    minLength: 1
                    type: string
                  updatedAt:
                    minLength: 1
                    type: string
  "/v1/projects/{projectId}":
    get:
      parameters:
      - schema:
          minLength: 1
          type: string
        in: path
        name: projectId
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: false
                type: object
                required:
                - id
                - workspaceId
                - name
                - status
                - createdAt
                - updatedAt
                properties:
                  id:
                    minLength: 1
                    type: string
                  workspaceId:
                    minLength: 1
                    type: string
                  name:
                    minLength: 1
                    maxLength: 120
                    type: string
                  status:
                    anyOf:
                    - type: string
                      enum:
                      - active
                    - type: string
                      enum:
                      - deleting
                  folderId:
                    minLength: 1
                    type: string
                  createdBy:
                    minLength: 1
                    type: string
                  createdAt:
                    minLength: 1
                    type: string
                  updatedAt:
                    minLength: 1
                    type: string
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              type: object
              required:
              - name
              properties:
                name:
                  minLength: 1
                  maxLength: 120
                  type: string
      parameters:
      - schema:
          minLength: 1
          type: string
        in: path
        name: projectId
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: false
                type: object
                required:
                - id
                - workspaceId
                - name
                - status
                - createdAt
                - updatedAt
                properties:
                  id:
                    minLength: 1
                    type: string
                  workspaceId:
                    minLength: 1
                    type: string
                  name:
                    minLength: 1
                    maxLength: 120
                    type: string
                  status:
                    anyOf:
                    - type: string
                      enum:
                      - active
                    - type: string
                      enum:
                      - deleting
                  folderId:
                    minLength: 1
                    type: string
                  createdBy:
                    minLength: 1
                    type: string
                  createdAt:
                    minLength: 1
                    type: string
                  updatedAt:
                    minLength: 1
                    type: string
    delete:
      parameters:
      - schema:
          minLength: 1
          type: string
        in: path
        name: projectId
        required: true
      responses:
        '202':
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: false
                type: object
                required:
                - id
                - workspaceId
                - name
                - status
                - createdAt
                - updatedAt
                properties:
                  id:
                    minLength: 1
                    type: string
                  workspaceId:
                    minLength: 1
                    type: string
                  name:
                    minLength: 1
                    maxLength: 120
                    type: string
                  status:
                    anyOf:
                    - type: string
                      enum:
                      - active
                    - type: string
                      enum:
                      - deleting
                  folderId:
                    minLength: 1
                    type: string
                  createdBy:
                    minLength: 1
                    type: string
                  createdAt:
                    minLength: 1
                    type: string
                  updatedAt:
                    minLength: 1
                    type: string
  "/v1/projects/{projectId}/document":
    get:
      parameters:
      - schema:
          minLength: 1
          type: string
        in: path
        name: projectId
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: false
                type: object
                required:
                - projectId
                - revision
                - document
                - updatedAt
                properties:
                  projectId:
                    minLength: 1
                    type: string
                  revision:
                    minimum: 0
                    type: integer
                  document:
                    additionalProperties: false
                    type: object
                    required:
                    - schemaVersion
                    - artboards
                    - sources
                    - objects
                    - groups
                    - constraints
                    - styles
                    properties:
                      schemaVersion:
                        type: number
                        enum:
                        - 3
                      artboards:
                        minItems: 1
                        type: array
                        items:
                          additionalProperties: false
                          type: object
                          required:
                          - id
                          - name
                          - widthPt
                          - heightPt
                          - backgroundHex
                          properties:
                            id:
                              minLength: 1
                              type: string
                            name:
                              minLength: 1
                              type: string
                            widthPt:
                              exclusiveMinimum: 0
                              type: number
                            heightPt:
                              exclusiveMinimum: 0
                              type: number
                            backgroundHex:
                              pattern: "^#[0-9A-Fa-f]{6}$"
                              type: string
                      sources:
                        type: array
                        items:
                          additionalProperties: false
                          type: object
                          required:
                          - assetId
                          - widthPx
                          - heightPx
                          - calibration
                          - markers
                          properties:
                            assetId:
                              minLength: 1
                              type: string
                            widthPx:
                              minimum: 1
                              type: integer
                            heightPx:
                              minimum: 1
                              type: integer
                            calibration:
                              anyOf:
                              - additionalProperties: false
                                type: object
                                required:
                                - umPerPxX
                                - umPerPxY
                                - origin
                                properties:
                                  umPerPxX:
                                    exclusiveMinimum: 0
                                    type: number
                                  umPerPxY:
                                    exclusiveMinimum: 0
                                    type: number
                                  origin:
                                    anyOf:
                                    - type: string
                                      enum:
                                      - metadata
                                    - type: string
                                      enum:
                                      - manual
                              - type: 'null'
                            markers:
                              maxItems: 50
                              type: array
                              items:
                                additionalProperties: false
                                type: object
                                required:
                                - yPx
                                - kDa
                                properties:
                                  yPx:
                                    minimum: 0
                                    type: number
                                  kDa:
                                    exclusiveMinimum: 0
                                    maximum: 10000
                                    type: number
                      objects:
                        type: array
                        items:
                          anyOf:
                          - additionalProperties: false
                            type: object
                            required:
                            - id
                            - artboardId
                            - zIndex
                            - locked
                            - hidden
                            - type
                            - transform
                            - view
                            properties:
                              id:
                                minLength: 1
                                type: string
                              artboardId:
                                minLength: 1
                                type: string
                              zIndex:
                                type: integer
                              locked:
                                type: boolean
                              hidden:
                                type: boolean
                              type:
                                type: string
                                enum:
                                - image-view
                              transform:
                                additionalProperties: false
                                type: object
                                required:
                                - xPt
                                - yPt
                                - widthPt
                                - heightPt
                                - rotationDeg
                                properties:
                                  xPt:
                                    type: number
                                  yPt:
                                    type: number
                                  widthPt:
                                    exclusiveMinimum: 0
                                    type: number
                                  heightPt:
                                    exclusiveMinimum: 0
                                    type: number
                                  rotationDeg:
                                    type: number
                                    enum:
                                    - 0
                              view:
                                additionalProperties: false
                                type: object
                                required:
                                - sourceAssetId
                                - plane
                                - channel
                                - viewport
                                - rotationDeg
                                - flipX
                                - flipY
                                - display
                                properties:
                                  sourceAssetId:
                                    minLength: 1
                                    type: string
                                  plane:
                                    minimum: 0
                                    maximum: 10000
                                    type: integer
                                  channel:
                                    anyOf:
                                    - minimum: 0
                                      maximum: 3
                                      type: integer
                                    - type: 'null'
                                  viewport:
                                    additionalProperties: false
                                    type: object
                                    required:
                                    - x
                                    - y
                                    - width
                                    - height
                                    properties:
                                      x:
                                        minimum: 0
                                        maximum: 1
                                        type: number
                                      y:
                                        minimum: 0
                                        maximum: 1
                                        type: number
                                      width:
                                        exclusiveMinimum: 0
                                        maximum: 1
                                        type: number
                                      height:
                                        exclusiveMinimum: 0
                                        maximum: 1
                                        type: number
                                  rotationDeg:
                                    minimum: -180
                                    maximum: 180
                                    type: number
                                  flipX:
                                    type: boolean
                                  flipY:
                                    type: boolean
                                  display:
                                    additionalProperties: false
                                    type: object
                                    required:
                                    - levels
                                    - brightness
                                    - contrast
                                    - gamma
                                    - invert
                                    - lut
                                    properties:
                                      levels:
                                        additionalProperties: false
                                        type: object
                                        required:
                                        - black
                                        - white
                                        properties:
                                          black:
                                            minimum: 0
                                            maximum: 1
                                            type: number
                                          white:
                                            minimum: 0
                                            maximum: 1
                                            type: number
                                      brightness:
                                        minimum: -1
                                        maximum: 1
                                        type: number
                                      contrast:
                                        minimum: 0
                                        maximum: 4
                                        type: number
                                      gamma:
                                        minimum: 0.1
                                        maximum: 10
                                        type: number
                                      invert:
                                        type: boolean
                                      lut:
                                        anyOf:
                                        - type: string
                                          enum:
                                          - none
                                        - type: string
                                          enum:
                                          - gray
                                        - type: string
                                          enum:
                                          - red
                                        - type: string
                                          enum:
                                          - green
                                        - type: string
                                          enum:
                                          - blue
                                        - type: string
                                          enum:
                                          - cyan
                                        - type: string
                                          enum:
                                          - magenta
                                        - type: string
                                          enum:
                                          - yellow
                              sampleInfo:
                                additionalProperties: false
                                type: object
                                properties:
                                  target:
                                    maxLength: 200
                                    type: string
                                  antibody:
                                    maxLength: 200
                                    type: string
                                  dilution:
                                    maxLength: 200
                                    type: string
                                  lot:
                                    maxLength: 200
                                    type: string
                                  supplier:
                                    maxLength: 200
                                    type: string
                                  notes:
                                    maxLength: 1000
                                    type: string
                          - additionalProperties: false
                            type: object
                            required:
                            - id
                            - artboardId
                            - zIndex
                            - locked
                            - hidden
                            - type
                            - transform
                            - composite
                            properties:
                              id:
                                minLength: 1
                                type: string
                              artboardId:
                                minLength: 1
                                type: string
                              zIndex:
                                type: integer
                              locked:
                                type: boolean
                              hidden:
                                type: boolean
                              type:
                                type: string
                                enum:
                                - composite
                              transform:
                                additionalProperties: false
                                type: object
                                required:
                                - xPt
                                - yPt
                                - widthPt
                                - heightPt
                                - rotationDeg
                                properties:
                                  xPt:
                                    type: number
                                  yPt:
                                    type: number
                                  widthPt:
                                    exclusiveMinimum: 0
                                    type: number
                                  heightPt:
                                    exclusiveMinimum: 0
                                    type: number
                                  rotationDeg:
                                    type: number
                                    enum:
                                    - 0
                              composite:
                                additionalProperties: false
                                type: object
                                required:
                                - viewport
                                - rotationDeg
                                - flipX
                                - flipY
                                - channels
                                properties:
                                  viewport:
                                    additionalProperties: false
                                    type: object
                                    required:
                                    - x
                                    - y
                                    - width
                                    - height
                                    properties:
                                      x:
                                        minimum: 0
                                        maximum: 1
                                        type: number
                                      y:
                                        minimum: 0
                                        maximum: 1
                                        type: number
                                      width:
                                        exclusiveMinimum: 0
                                        maximum: 1
                                        type: number
                                      height:
                                        exclusiveMinimum: 0
                                        maximum: 1
                                        type: number
                                  rotationDeg:
                                    minimum: -180
                                    maximum: 180
                                    type: number
                                  flipX:
                                    type: boolean
                                  flipY:
                                    type: boolean
                                  channels:
                                    minItems: 1
                                    maxItems: 8
                                    type: array
                                    items:
                                      additionalProperties: false
                                      type: object
                                      required:
                                      - sourceAssetId
                                      - plane
                                      - channel
                                      - display
                                      - visible
                                      properties:
                                        sourceAssetId:
                                          minLength: 1
                                          type: string
                                        plane:
                                          minimum: 0
                                          maximum: 10000
                                          type: integer
                                        channel:
                                          anyOf:
                                          - minimum: 0
                                            maximum: 3
                                            type: integer
                                          - type: 'null'
                                        display:
                                          additionalProperties: false
                                          type: object
                                          required:
                                          - levels
                                          - brightness
                                          - contrast
                                          - gamma
                                          - invert
                                          - lut
                                          properties:
                                            levels:
                                              additionalProperties: false
                                              type: object
                                              required:
                                              - black
                                              - white
                                              properties:
                                                black:
                                                  minimum: 0
                                                  maximum: 1
                                                  type: number
                                                white:
                                                  minimum: 0
                                                  maximum: 1
                                                  type: number
                                            brightness:
                                              minimum: -1
                                              maximum: 1
                                              type: number
                                            contrast:
                                              minimum: 0
                                              maximum: 4
                                              type: number
                                            gamma:
                                              minimum: 0.1
                                              maximum: 10
                                              type: number
                                            invert:
                                              type: boolean
                                            lut:
                                              anyOf:
                                              - type: string
                                                enum:
                                                - none
                                              - type: string
                                                enum:
                                                - gray
                                              - type: string
                                                enum:
                                                - red
                                              - type: string
                                                enum:
                                                - green
                                              - type: string
                                                enum:
                                                - blue
                                              - type: string
                                                enum:
                                                - cyan
                                              - type: string
                                                enum:
                                                - magenta
                                              - type: string
                                                enum:
                                                - yellow
                                        visible:
                                          type: boolean
                              sampleInfo:
                                additionalProperties: false
                                type: object
                                properties:
                                  target:
                                    maxLength: 200
                                    type: string
                                  antibody:
                                    maxLength: 200
                                    type: string
                                  dilution:
                                    maxLength: 200
                                    type: string
                                  lot:
                                    maxLength: 200
                                    type: string
                                  supplier:
                                    maxLength: 200
                                    type: string
                                  notes:
                                    maxLength: 1000
                                    type: string
                          - additionalProperties: false
                            type: object
                            required:
                            - id
                            - artboardId
                            - zIndex
                            - locked
                            - hidden
                            - type
                            - transform
                            - text
                            properties:
                              id:
                                minLength: 1
                                type: string
                              artboardId:
                                minLength: 1
                                type: string
                              zIndex:
                                type: integer
                              locked:
                                type: boolean
                              hidden:
                                type: boolean
                              type:
                                type: string
                                enum:
                                - text
                              transform:
                                additionalProperties: false
                                type: object
                                required:
                                - xPt
                                - yPt
                                - widthPt
                                - heightPt
                                - rotationDeg
                                properties:
                                  xPt:
                                    type: number
                                  yPt:
                                    type: number
                                  widthPt:
                                    exclusiveMinimum: 0
                                    type: number
                                  heightPt:
                                    exclusiveMinimum: 0
                                    type: number
                                  rotationDeg:
                                    minimum: -180
                                    maximum: 180
                                    type: number
                              text:
                                additionalProperties: false
                                type: object
                                required:
                                - content
                                - style
                                properties:
                                  content:
                                    minLength: 1
                                    maxLength: 2000
                                    type: string
                                  style:
                                    additionalProperties: false
                                    type: object
                                    required:
                                    - fontSizePt
                                    - bold
                                    - italic
                                    - underline
                                    - colorHex
                                    - align
                                    - backgroundHex
                                    properties:
                                      fontSizePt:
                                        minimum: 2
                                        maximum: 144
                                        type: number
                                      bold:
                                        type: boolean
                                      italic:
                                        type: boolean
                                      underline:
                                        type: boolean
                                      colorHex:
                                        pattern: "^#[0-9A-Fa-f]{6}$"
                                        type: string
                                      align:
                                        anyOf:
                                        - type: string
                                          enum:
                                          - start
                                        - type: string
                                          enum:
                                          - middle
                                        - type: string
                                          enum:
                                          - end
                                      backgroundHex:
                                        anyOf:
                                        - pattern: "^#[0-9A-Fa-f]{6}$"
                                          type: string
                                        - type: 'null'
                              panelLabel:
                                additionalProperties: false
                                type: object
                                required:
                                - targetObjectId
                                - auto
                                properties:
                                  targetObjectId:
                                    minLength: 1
                                    type: string
                                  auto:
                                    type: boolean
                          - additionalProperties: false
                            type: object
                            required:
                            - id
                            - artboardId
                            - zIndex
                            - locked
                            - hidden
                            - type
                            - transform
                            - line
                            properties:
                              id:
                                minLength: 1
                                type: string
                              artboardId:
                                minLength: 1
                                type: string
                              zIndex:
                                type: integer
                              locked:
                                type: boolean
                              hidden:
                                type: boolean
                              type:
                                type: string
                                enum:
                                - line
                              transform:
                                additionalProperties: false
                                type: object
                                required:
                                - xPt
                                - yPt
                                - widthPt
                                - heightPt
                                - rotationDeg
                                properties:
                                  xPt:
                                    type: number
                                  yPt:
                                    type: number
                                  widthPt:
                                    minimum: 0
                                    type: number
                                  heightPt:
                                    minimum: 0
                                    type: number
                                  rotationDeg:
                                    type: number
                                    enum:
                                    - 0
                              line:
                                additionalProperties: false
                                type: object
                                required:
                                - direction
                                - heads
                                - stroke
                                properties:
                                  direction:
                                    anyOf:
                                    - type: string
                                      enum:
                                      - down
                                    - type: string
                                      enum:
                                      - up
                                  heads:
                                    anyOf:
                                    - type: string
                                      enum:
                                      - none
                                    - type: string
                                      enum:
                                      - start
                                    - type: string
                                      enum:
                                      - end
                                    - type: string
                                      enum:
                                      - both
                                  stroke:
                                    additionalProperties: false
                                    type: object
                                    required:
                                    - colorHex
                                    - widthPt
                                    - dashed
                                    properties:
                                      colorHex:
                                        pattern: "^#[0-9A-Fa-f]{6}$"
                                        type: string
                                      widthPt:
                                        minimum: 0.1
                                        maximum: 20
                                        type: number
                                      dashed:
                                        type: boolean
                          - additionalProperties: false
                            type: object
                            required:
                            - id
                            - artboardId
                            - zIndex
                            - locked
                            - hidden
                            - type
                            - transform
                            - shape
                            properties:
                              id:
                                minLength: 1
                                type: string
                              artboardId:
                                minLength: 1
                                type: string
                              zIndex:
                                type: integer
                              locked:
                                type: boolean
                              hidden:
                                type: boolean
                              type:
                                type: string
                                enum:
                                - shape
                              transform:
                                additionalProperties: false
                                type: object
                                required:
                                - xPt
                                - yPt
                                - widthPt
                                - heightPt
                                - rotationDeg
                                properties:
                                  xPt:
                                    type: number
                                  yPt:
                                    type: number
                                  widthPt:
                                    exclusiveMinimum: 0
                                    type: number
                                  heightPt:
                                    exclusiveMinimum: 0
                                    type: number
                                  rotationDeg:
                                    minimum: -180
                                    maximum: 180
                                    type: number
                              shape:
                                anyOf:
                                - additionalProperties: false
                                  type: object
                                  required:
                                  - kind
                                  - stroke
                                  - fillHex
                                  properties:
                                    kind:
                                      anyOf:
                                      - type: string
                                        enum:
                                        - rect
                                      - type: string
                                        enum:
                                        - ellipse
                                    stroke:
                                      anyOf:
                                      - additionalProperties: false
                                        type: object
                                        required:
                                        - colorHex
                                        - widthPt
                                        - dashed
                                        properties:
                                          colorHex:
                                            pattern: "^#[0-9A-Fa-f]{6}$"
                                            type: string
                                          widthPt:
                                            minimum: 0.1
                                            maximum: 20
                                            type: number
                                          dashed:
                                            type: boolean
                                      - type: 'null'
                                    fillHex:
                                      anyOf:
                                      - pattern: "^#[0-9A-Fa-f]{6}$"
                                        type: string
                                      - type: 'null'
                                - additionalProperties: false
                                  type: object
                                  required:
                                  - kind
                                  - opening
                                  - stroke
                                  properties:
                                    kind:
                                      type: string
