                  projectId:
                    minLength: 1
                    type: string
                  filename:
                    minLength: 1
                    type: string
                  mimeType:
                    minLength: 1
                    type: string
                  checksumSha256:
                    pattern: "^[a-f0-9]{64}$"
                    type: string
                  widthPx:
                    minimum: 1
