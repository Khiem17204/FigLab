                              transform:
                                additionalProperties: false
                                type: object
                                required:
                                - xPt
                                - yPt
                                - widthPt
                                - heightPt
                                - rotationDeg
                                properties:
                                  xPt:
                                    type: number
                                  yPt:
                                    type: number
                                  widthPt:
                                    minimum: 0
                                    type: number
                                  heightPt:
                                    minimum: 0
                                    type: number
                                  rotationDeg:
                                    type: number
                                    enum:
                                    - 0
                              line:
                                additionalProperties: false
                                type: object
                                required:
                                - direction
                                - heads
                                - stroke
                                properties:
                                  direction:
                                    anyOf:
                                    - type: string
