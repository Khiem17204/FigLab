                                    maximum: 1
                                    type: number
                                  height:
                                    exclusiveMinimum: 0
                                    maximum: 1
                                    type: number
                              display:
                                additionalProperties: false
                                type: object
                                required:
                                - brightness
                                - contrast
                                - gamma
                                - invert
                                properties:
                                  brightness:
                                    minimum: -1
                                    maximum: 1
                                    type: number
                                  contrast:
                                    minimum: 0
                                    maximum: 4
                                    type: number
                                  gamma:
                                    minimum: 0.1
                                    maximum: 10
                                    type: number
                                  invert:
                                    type: boolean
                    groups:
                      type: array
                      minItems: 0
                      maxItems: 0
                    constraints:
                      type: array
                      minItems: 0
                      maxItems: 0
                    styles:
                      type: array
                      minItems: 0
                      maxItems: 0
      parameters:
      - schema:
          minLength: 1
          type: string
        in: path
        name: projectId
        required: true
      responses:
