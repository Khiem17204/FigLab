  "/v1/projects/{projectId}/uploads":
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              type: object
              required:
              - filename
              - contentType
              - contentLength
              - checksumSha256
              properties:
                filename:
                  minLength: 1
                  maxLength: 255
                  type: string
                contentType:
                  minLength: 1
                  maxLength: 255
                  type: string
                contentLength:
                  minimum: 1
                  maximum: 104857600
                  type: integer
                checksumSha256:
                  pattern: "^[a-f0-9]{64}$"
                  type: string
      parameters:
      - schema:
          minLength: 1
          type: string
        in: path
        name: projectId
        required: true
      responses:
        '201':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - uploadId
                - assetId
                - upload
                properties:
                  uploadId:
                    type: string
                  assetId:
                    type: string
                  upload:
                    type: object
                    required:
                    - url
                    - method
                    - headers
                    - expiresAt
                    properties:
                      url:
                        type: string
                      method:
                        type: string
                        enum:
                        - PUT
                      headers:
                        type: object
                        additionalProperties:
                          type: string
                      expiresAt:
                        type: string
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    enum:
                    - UPLOAD_INVALID
                  message:
                    type: string
  "/v1/uploads/{uploadId}/complete":
