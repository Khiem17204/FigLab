    get:
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
  "/v1/me":
    get:
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: false
                type: object
                required:
                - email
                - role
                properties:
                  email:
                    minLength: 1
                    type: string
                  role:
                    anyOf:
                    - type: string
                      enum:
                      - admin
                    - type: string
                      enum:
                      - member
  "/v1/projects":
    get:
