                          - widthPt
                          - heightPt
                          - backgroundHex
                          properties:
                            id:
                              minLength: 1
                              type: string
                            name:
                              minLength: 1
                              type: string
                            widthPt:
                              exclusiveMinimum: 0
                              type: number
                            heightPt:
                              exclusiveMinimum: 0
                              type: number
                            backgroundHex:
                              pattern: "^#[0-9A-Fa-f]{6}$"
                              type: string
                      objects:
                        type: array
                        items:
                          additionalProperties: false
                          type: object
                          required:
                          - id
                          - type
                          - artboardId
                          - transform
                          - zIndex
                          - locked
                          - hidden
                          - view
                          properties:
                            id:
                              minLength: 1
                              type: string
                            type:
                              type: string
                              enum:
                              - image-view
                            artboardId:
                              minLength: 1
                              type: string
                            transform:
                              additionalProperties: false
                              type: object
                              required:
                              - xPt
                              - yPt
                              - widthPt
                              - heightPt
                              - rotationDeg
                              properties:
                                xPt:
                                  type: number
                                yPt:
                                  type: number
                                widthPt:
                                  exclusiveMinimum: 0
                                  type: number
                                heightPt:
                                  exclusiveMinimum: 0
                                  type: number
                                rotationDeg:
                                  type: number
                                  enum:
                                  - 0
                            zIndex:
                              type: integer
                            locked:
                              type: boolean
                            hidden:
                              type: boolean
                            view:
                              additionalProperties: false
                              type: object
                              required:
                              - sourceAssetId
