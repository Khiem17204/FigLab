          content:
            application/json:
              schema:
                additionalProperties: false
                type: object
                required:
                - projects
                properties:
                  projects:
                    type: array
                    items:
                      additionalProperties: false
                      type: object
                      required:
                      - id
                      - workspaceId
                      - name
                      - status
                      - createdAt
                      - updatedAt
                      properties:
