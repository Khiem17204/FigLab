                                      - down
                                    - type: string
                                      enum:
                                      - up
                                  heads:
                                    anyOf:
                                    - type: string
                                      enum:
                                      - none
                                    - type: string
                                      enum:
                                      - start
                                    - type: string
                                      enum:
                                      - end
                                    - type: string
                                      enum:
                                      - both
                                  stroke:
                                    additionalProperties: false
                                    type: object
                                    required:
                                    - colorHex
                                    - widthPt
                                    - dashed
                                    properties:
                                      colorHex:
                                        pattern: "^#[0-9A-Fa-f]{6}$"
                                        type: string
                                      widthPt:
                                        minimum: 0.1
                                        maximum: 20
                                        type: number
                                      dashed:
                                        type: boolean
                          - additionalProperties: false
                            type: object
                            required:
                            - id
                            - artboardId
                            - zIndex
                            - locked
                            - hidden
                            - type
                            - transform
                            - shape
                            properties:
                              id:
                                minLength: 1
                                type: string
                              artboardId:
                                minLength: 1
                                type: string
                              zIndex:
                                type: integer
                              locked:
                                type: boolean
                              hidden:
                                type: boolean
                              type:
                                type: string
                                enum:
