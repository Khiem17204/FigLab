      parameters:
      - schema:
          minLength: 1
          type: string
        in: path
        name: uploadId
        required: true
      responses:
        '202':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - assetId
                - status
                properties:
                  assetId:
                    type: string
                  status:
                    anyOf:
                    - type: string
                      enum:
                      - pending-verification
                    - type: string
                      enum:
                      - ready
                    - type: string
                      enum:
                      - rejected
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    anyOf:
