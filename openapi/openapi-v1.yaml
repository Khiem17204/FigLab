                                  heightPt:
                                    exclusiveMinimum: 0
                                    type: number
                                  rotationDeg:
                                    minimum: -180
                                    maximum: 180
                                    type: number
                              shape:
                                anyOf:
                                - additionalProperties: false
                                  type: object
                                  required:
                                  - kind
                                  - stroke
                                  - fillHex
                                  properties:
                                    kind:
                                      anyOf:
                                      - type: string
