  "/v1/projects/{projectId}/document":
    get:
      parameters:
      - schema:
          minLength: 1
          type: string
        in: path
        name: projectId
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: false
                type: object
                required:
                - projectId
                - revision
                - document
                - updatedAt
                properties:
                  projectId:
                    minLength: 1
                    type: string
                  revision:
                    minimum: 0
                    type: integer
                  document:
                    additionalProperties: false
                    type: object
                    required:
                    - schemaVersion
                    - artboards
                    - objects
                    - groups
                    - constraints
                    - styles
                    properties:
                      schemaVersion:
                        type: number
                        enum:
                        - 2
                      artboards:
                        minItems: 1
                        type: array
                        items:
                          additionalProperties: false
                          type: object
                          required:
                          - id
                          - name
                          - widthPt
                          - heightPt
                          - backgroundHex
                          properties:
                            id:
                              minLength: 1
                              type: string
                            name:
                              minLength: 1
                              type: string
                            widthPt:
                              exclusiveMinimum: 0
                              type: number
                            heightPt:
                              exclusiveMinimum: 0
                              type: number
                            backgroundHex:
                              pattern: "^#[0-9A-Fa-f]{6}$"
                              type: string
                      objects:
                        type: array
                        items:
                          anyOf:
                          - additionalProperties: false
                            type: object
                            required:
                            - id
                            - type
                            - artboardId
                            - transform
                            - zIndex
                            - locked
                            - hidden
                            - view
                            properties:
                              id:
                                minLength: 1
                                type: string
                              type:
                                type: string
                                enum:
                                - image-view
                              artboardId:
                                minLength: 1
                                type: string
                              transform:
                                additionalProperties: false
                                type: object
                                required:
                                - xPt
                                - yPt
                                - widthPt
                                - heightPt
                                - rotationDeg
                                properties:
                                  xPt:
                                    type: number
                                  yPt:
                                    type: number
                                  widthPt:
                                    exclusiveMinimum: 0
                                    type: number
                                  heightPt:
                                    exclusiveMinimum: 0
                                    type: number
                                  rotationDeg:
                                    type: number
                                    enum:
                                    - 0
                              zIndex:
                                type: integer
                              locked:
                                type: boolean
                              hidden:
                                type: boolean
                              view:
                                additionalProperties: false
                                type: object
                                required:
                                - sourceAssetId
                                - viewport
                                - display
                                properties:
                                  sourceAssetId:
                                    minLength: 1
                                    type: string
                                  viewport:
                                    additionalProperties: false
                                    type: object
                                    required:
                                    - x
                                    - y
                                    - width
                                    - height
                                    properties:
                                      x:
                                        minimum: 0
                                        maximum: 1
                                        type: number
                                      y:
                                        minimum: 0
                                        maximum: 1
                                        type: number
                                      width:
                                        exclusiveMinimum: 0
                                        maximum: 1
                                        type: number
                                      height:
                                        exclusiveMinimum: 0
                                        maximum: 1
                                        type: number
                                  display:
                                    additionalProperties: false
                                    type: object
                                    required:
                                    - brightness
                                    - contrast
                                    - gamma
                                    - invert
                                    properties:
                                      brightness:
                                        minimum: -1
                                        maximum: 1
                                        type: number
                                      contrast:
                                        minimum: 0
                                        maximum: 4
                                        type: number
                                      gamma:
                                        minimum: 0.1
                                        maximum: 10
                                        type: number
                                      invert:
                                        type: boolean
                          - additionalProperties: false
                            type: object
                            required:
                            - id
                            - artboardId
                            - zIndex
                            - locked
                            - hidden
                            - type
                            - transform
                            - text
                            properties:
                              id:
                                minLength: 1
                                type: string
                              artboardId:
                                minLength: 1
                                type: string
                              zIndex:
                                type: integer
                              locked:
                                type: boolean
                              hidden:
                                type: boolean
                              type:
                                type: string
                                enum:
                                - text
                              transform:
                                additionalProperties: false
                                type: object
                                required:
                                - xPt
                                - yPt
                                - widthPt
                                - heightPt
                                - rotationDeg
                                properties:
                                  xPt:
                                    type: number
                                  yPt:
                                    type: number
                                  widthPt:
                                    exclusiveMinimum: 0
                                    type: number
                                  heightPt:
                                    exclusiveMinimum: 0
                                    type: number
                                  rotationDeg:
                                    minimum: -180
                                    maximum: 180
                                    type: number
                              text:
                                additionalProperties: false
                                type: object
                                required:
                                - content
                                - style
                                properties:
                                  content:
                                    minLength: 1
                                    maxLength: 2000
                                    type: string
                                  style:
