                  document:
                    additionalProperties: false
                    type: object
                    required:
                    - schemaVersion
                    - artboards
                    - objects
                    - groups
                    - constraints
                    - styles
                    properties:
                      schemaVersion:
                        type: number
                        enum:
                        - 1
                      artboards:
                        minItems: 1
                        type: array
                        items:
                          additionalProperties: false
                          type: object
                          required:
